[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mike"
version = "0.1.0"
description = "MIK-e: a minimal intelligence kernel, embodied. An auditable instrument for research on small tool-using reasoning systems"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.5", "transformers>=4.50,<5", "safetensors>=0.4"]

[project.scripts]
mike = "mike.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
